<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Classic Apple 6-Stripe Rainbow Gradient -->
    <linearGradient id="appleRainbow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#61bb46"/>
      <stop offset="16.6%" stop-color="#61bb46"/>
      <stop offset="16.7%" stop-color="#fdb827"/>
      <stop offset="33.3%" stop-color="#fdb827"/>
      <stop offset="33.4%" stop-color="#f58220"/>
      <stop offset="50.0%" stop-color="#f58220"/>
      <stop offset="50.1%" stop-color="#e03a3e"/>
      <stop offset="66.6%" stop-color="#e03a3e"/>
      <stop offset="66.7%" stop-color="#963d97"/>
      <stop offset="83.3%" stop-color="#963d97"/>
      <stop offset="83.4%" stop-color="#009ae2"/>
      <stop offset="100%" stop-color="#009ae2"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Tab Clarity -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Apple Leaf (Green) -->
    <path d="M72 12 C77 6 85 2 92 2 C93 9 89 17 84 22 C79 28 71 32 64 31 C63 24 67 17 72 12 Z" fill="#61bb46"/>

    <!-- Apple Body (6-Stripe Rainbow Fill) -->
    <path d="M85 36 C73 36 67 29 55 29 C42 29 33 37 25 50 C13 70 21 104 38 104 C45 104 51 99 59 99 C67 99 72 104 80 104 C97 104 105 72 105 71 C104 71 89 65 89 47 C89 32 101 25 102 24 C94 13 81 12 76 11.5 C64 10.5 56 18 48 18 C40 18 31 11.5 17 12 C6 12.5 0 21 0 21" transform="translate(10, 8)" fill="url(#appleRainbow)"/>

    <!-- HG Monogram Badge Cutout in Center -->
    <g transform="translate(64, 72)">
      <!-- Soft dark backdrop pill inside apple for ultra-crisp text readability -->
      <rect x="-30" y="-18" width="60" height="34" rx="10" fill="#0d1117" fill-opacity="0.88" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
      <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Georgia', sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">HG</text>
    </g>
  </g>
</svg>
